[package]
name = "unified-server"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Composition host for unified service deployment"

[lib]
name = "unified_server"

[[bin]]
name = "unified-server"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:cli", "dep:dialoguer", "dep:env_logger", "tokio/signal"]
completions = ["cli", "dep:clap_complete"]
swagger-ui = ["idp-server/swagger-ui", "management-server/swagger-ui", "device-server/swagger-ui", "storage-server/swagger-ui"]

[dependencies]
of-device-client = { path = "../device-client", default-features = false }
device-server = { path = "../device-server", default-features = false }
device-service = { path = "../device-service", default-features = false, features = ["replica", "std", "utoipa"] }
# Generated HTTP operations
of-idp-client = { path = "../idp-client", default-features = false }
of-management-client = { path = "../management-client", default-features = false }
of-storage-client = { path = "../storage-client", default-features = false }

# CLI
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help"], optional = true }
clap_complete = { version = "4.5", default-features = false, features = [], optional = true }
cli = { path = "../cli", default-features = false, features = ["std"], optional = true }
dialoguer = { version = "0.12", default-features = false, features = ["password"], optional = true }

# Configuration
config = { version = "0.15", default-features = false, features = ["yaml"] }

# Credentials
getrandom = { version = "0.3", default-features = false, features = ["std"] }
rust-argon2 = { version = "3.0", default-features = false }

# Internal
api = { path = "../api", default-features = false, features = [] }
db = { package = "idp-db", path = "../db", default-features = false, features = ["replica"] }
idp-model = { path = "../idp-model", default-features = false, features = ["std", "replica"] }
idp-server = { path = "../idp-server", default-features = false }
idp-service = { path = "../idp-service", default-features = false, features = ["replica", "std"] }
iroh-chain = { path = "../../../ofnet/crates/iroh-chain", default-features = false, features = [] }
management-server = { path = "../management-server", default-features = false }
management-service = { path = "../management-service", default-features = false, features = ["utoipa", "replica", "std"] }
model = { path = "../model", default-features = false, features = ["std"] }
storage-server = { path = "../storage-server", default-features = false, features = ["network"] }

# Persistence
ofdb-sql = { path = "../../../ofdb/crates/sql", default-features = false, features = ["native-stage"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }

# TLS
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Iroh
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }

# Async
tokio = { version = "1.52", default-features = false, features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-util = { version = "0.7", default-features = false, features = [] }

# Logging
env_logger = { version = "0.10", default-features = false, features = [], optional = true }
log = { version = "0.4", default-features = false, features = ["std"] }

# Web
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
tower-http = { version = "0.7", default-features = false, features = ["cors", "trace", "compression-gzip"] }

[dev-dependencies]
# OpenAPI contract export example
utoipa = { version = "5.5", default-features = false }

# Generated HTTP contract consumers (no server dependencies in clients)
of-idp-client = { path = "../idp-client", default-features = false }
of-storage-client = { path = "../storage-client", default-features = false }

# Setup trust/verifier fault injection, never a production feature
api = { path = "../api", default-features = false, features = ["test-support"] }

# Storage API integration
file-system = { path = "../../../offs/crates/file-system", default-features = false, features = [] }
storage-model = { path = "../storage-model", default-features = false, features = ["std"] }
storage-service = { path = "../storage-service", default-features = false, features = [] }

# Identity fixtures
keyring-core = { version = "1.0", default-features = false, features = [] }

# Wire assertions
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

# Web
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = { version = "1.4", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
