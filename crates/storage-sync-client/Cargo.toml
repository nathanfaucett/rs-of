[package]
name = "storage-sync-client"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = ["native"]
native = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "ofdb-sql/sync"]
browser = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:futures-channel", "dep:web-sys", "dep:js-sys", "ofdb-sql/sync"]

[dependencies]
# Internal
ofdb-sql = { package = "ofdb-sql", path = "../../../ofdb/crates/sql", default-features = false, features = ["sync", "redb"] }
ofdb-sql-sync = { package = "ofdb-sql-sync", path = "../../../ofdb/crates/sql-sync", default-features = false, features = ["native-stage"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
crc32fast = { version = "1.5", default-features = false }
uuid = { version = "1.29", default-features = false, features = ["serde", "std"] }

# Error handling
thiserror = { version = "2.0", default-features = false }

# Async
tokio = { version = "1.52", default-features = false, features = ["macros", "rt-multi-thread"], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-native-roots", "connect"], optional = true }
futures-channel = { version = "0.3", default-features = false, features = ["std"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
async-trait = { version = "0.1", default-features = false }

# WASM
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"], optional = true }
wasm-bindgen-futures = { version = "0.4", default-features = false, features = ["std"], optional = true }
web-sys = { version = "0.3", default-features = false, features = ["WebSocket", "BinaryType", "MessageEvent", "ErrorEvent", "CloseEvent", "Event"], optional = true }
js-sys = { version = "0.3", default-features = false, optional = true }

# Logging
log = { version = "0.4", default-features = false, features = ["std"] }
