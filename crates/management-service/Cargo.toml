[package]
name = "management-service"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Role, permission, and assignment service over the identity database"

[lib]
name = "management_service"

[features]
default = []
utoipa = ["std", "idp-model/utoipa"]
replica = ["std", "dep:db", "idp-model/replica"]
std = ["idp-model/std"]

[dependencies]
# Internal
idp-model = { path = "../idp-model", default-features = false }
db = { package = "idp-db", path = "../db", default-features = false, optional = true }

# Error handling
thiserror = { version = "2.0", default-features = false }

# Serialization
serde = { version = "1.0", default-features = false }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# Internal
idp-model = { path = "../idp-model", default-features = false, features = [
    "std",
] }

# Async
tokio = { version = "1.52", default-features = false, features = [
    "macros",
    "rt",
] }
