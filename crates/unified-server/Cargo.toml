[package]
name = "unified-server"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Composition host for unified service deployment"

[lib]
name = "unified_server"

[[bin]]
name = "unified-server"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
independent-contracts = ["idp-server/independent", "device-server/independent", "storage-server/independent", "server-common/independent", "device-service/independent"]
cli = ["dep:clap", "dep:cli", "dep:env_logger", "tokio/signal"]
completions = ["cli", "dep:clap_complete"]
swagger-ui = [
    "idp-server/swagger-ui",
    "management-server/swagger-ui",
    "device-server/swagger-ui",
    "storage-server/swagger-ui",
]

[dependencies]
# CLI
clap = { version = "4.6", default-features = false, features = [
    "std",
    "derive",
    "help",
], optional = true }
clap_complete = { version = "4.5", default-features = false, features = [
], optional = true }
cli = { path = "../cli", default-features = false, features = [
    "std",
], optional = true }

# Internal
device-server = { path = "../device-server", default-features = false }
embedded-db = { path = "../embedded-db", default-features = false }
idp-server = { path = "../idp-server", default-features = false }
management-server = { path = "../management-server", default-features = false }
storage-server = { path = "../storage-server", default-features = false, features = [
    "network",
] }

# Serialization
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "rustls-tls-native-roots",
] }

# Async
tokio = { version = "1.52", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
] }
tokio-util = { version = "0.7", default-features = false, features = [] }

# Logging
env_logger = { version = "0.10", default-features = false, features = [
], optional = true }

# TLS
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }

# Web
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["cors"] }

[dev-dependencies]
# Contract export
device-service = { path = "../device-service", default-features = false, features = [
    "replica",
    "std",
    "utoipa",
] }
of-model = { path = "../of-model", default-features = false, features = [
    "replica",
    "std",
] }
server-common = { path = "../server-common", default-features = false }

# OpenAPI contract export example
utoipa = { version = "5.5", default-features = false }

# Process fixtures
tempfile = { version = "3.27", default-features = false }

[[example]]
name = "export-openapi"
required-features = ["independent-contracts"]
