[package]
name = "management-server"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Management role, permission, and assignment API"

[lib]
name = "management_server"

[features]
default = ["swagger-ui"]
swagger-ui = ["dep:utoipa-swagger-ui"]

[dependencies]
# Internal
api = { path = "../api", default-features = false }
db = { package = "idp-db", path = "../db", default-features = false, features = [
    "replica",
] }
device-service = { path = "../device-service", default-features = false, features = [
    "replica",
    "std",
    "utoipa",
] }
idp-model = { path = "../idp-model", default-features = false, features = [
    "std",
    "utoipa",
    "axum",
    "replica",
] }
management-service = { path = "../management-service", default-features = false, features = [
    "replica",
    "std",
    "utoipa",
] }
model = { path = "../model", default-features = false, features = [
    "std",
    "utoipa",
    "axum",
] }

# Configuration
config = { version = "0.15", default-features = false, features = ["yaml"] }

# Logging
log = { version = "0.4", default-features = false, features = ["std"] }

# Serialization
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Web
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "http2",
    "query",
    "json",
    "tokio",
    "macros",
] }
http = { version = "1.4", default-features = false }
utoipa = { version = "5.5", default-features = false, features = ["macros"] }
utoipa-axum = { version = "0.2", default-features = false }
utoipa-swagger-ui = { version = "9.0", default-features = false, features = [
    "axum",
], optional = true }

[dev-dependencies]
# Async
tokio = { version = "1.52", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }

# Web
tower = { version = "0.5", default-features = false, features = ["util"] }
