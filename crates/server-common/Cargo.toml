[package]
name = "server-common"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OAuth 2.x API"

[lib]
name = "server_common"

[features]
default = []
independent = ["dep:setup"]
test-support = ["independent", "setup/test-support"]

[dependencies]
# Internal
of-model = { path = "../model", default-features = false, features = ["std"] }
setup = { path = "../setup", default-features = false, optional = true }

# Logging
log = { version = "0.4", default-features = false }

# Web
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
] }
utoipa = { version = "5.5", default-features = false, features = ["macros"] }

# Async
tokio = { version = "1.52", default-features = false, features = [
    "net",
    "signal",
    "rt",
    "macros",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", default-features = false }

# Shared owner HTTPS test fixture
[dependencies.serde_json]
version = "1.0"
default-features = false
features = ["std"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls-native-roots"]

[lints]
workspace = true
