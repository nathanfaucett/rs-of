[package]
name = "unified-server"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Composition host for unified service deployment"

[lib]
name = "unified_server"

[[bin]]
name = "unified-server"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "independent-contracts"]
independent-contracts = [
    "dep:setup",
    "dep:utoipa",
    "idp-server/independent",
    "device-server/independent",
    "storage-server/independent",
    "server-common/independent",
]
cli = ["dep:clap", "dep:cli", "dep:env_logger", "tokio/signal"]
completions = ["cli", "dep:clap_complete"]

[dependencies]
# CLI
clap = { version = "4.6", default-features = false, features = [
    "std",
    "derive",
    "help",
], optional = true }
clap_complete = { version = "4.5", default-features = false, features = [
], optional = true }
cli = { path = "../cli", default-features = false, features = [
    "std",
], optional = true }

# Internal
device-server = { path = "../device-server", default-features = false }
device-service = { path = "../device-service", default-features = false, features = [
    "ofdb",
    "std",
] }
idp-service = { path = "../idp-service", default-features = false, features = [
    "local-private-keys",
    "ofdb",
    "std",
] }
management-service = { path = "../management-service", default-features = false, features = [
    "ofdb",
] }
db = { package = "of-db", path = "../db", default-features = false, features = [
    "native",
] }
idp-server = { path = "../idp-server", default-features = false }
management-server = { path = "../management-server", default-features = false }
server-common = { path = "../server-common", default-features = false }
storage-server = { path = "../storage-server", default-features = false, features = [
    "sync",
    "independent",
] }

setup = { path = "../setup", default-features = false, features = [
    "join",
    "operator-login",
], optional = true }

of-model = { path = "../model", default-features = false, features = [
    "ofdb",
    "std",
] }
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }

# Serialization
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "rustls-tls-native-roots",
] }

# Async
async-stream = { version = "0.3", default-features = false }
tokio = { version = "1.52", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
] }
tokio-util = { version = "0.7", default-features = false, features = [] }

# Logging
env_logger = { version = "0.10", default-features = false, features = [
], optional = true }


# Web
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "http2",
    "tokio",
] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["cors"] }
utoipa = { version = "5.5", default-features = false, features = [
    "macros",
], optional = true }

[dev-dependencies]
# Process fixtures
base64 = { version = "0.22", default-features = false, features = ["std"] }
tempfile = { version = "3.27", default-features = false }

[[example]]
name = "export-openapi"
required-features = ["independent-contracts"]

[lints]
workspace = true
