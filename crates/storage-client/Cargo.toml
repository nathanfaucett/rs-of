[package]
name = "of-storage-client"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = ["native"]
native = [
    "ofdb-sql/redb",
    "ofdb-kv/redb",
    "dep:tokio-tungstenite",
    "dep:tokio",
    "reqwest/rustls-tls-native-roots",
]
browser = ["ofdb-sql/indexeddb", "ofdb-kv/indexeddb", "dep:gloo-net"]

[dependencies]
# Data engines
ofdb-kv = { version = "0.1", path = "../../../ofdb/crates/kv", default-features = false, features = [
    "sync",
    "in-memory",
] }
ofdb-platform = { version = "0.1", path = "../../../ofdb/crates/platform", default-features = false }
ofdb-sql = { version = "0.1", path = "../../../ofdb/crates/sql", default-features = false, features = [
    "validated-history",
    "sql",
] }

# Serialization
crc32fast = { version = "1.5", default-features = false }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
uuid = { version = "1.29", default-features = false, features = [
    "serde",
    "v7",
    "js",
] }

# Transport
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
url = { version = "2.5", default-features = false, features = ["std"] }

# Errors
thiserror = { version = "2.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native transport
tokio = { version = "1.52", default-features = false, features = [
    "net",
], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser transport
gloo-net = { version = "0.6", default-features = false, features = [
    "websocket",
], optional = true }

[dev-dependencies]
# Owner protocol fixtures
axum = { version = "0.8", default-features = false, features = [
    "form",
    "http1",
    "json",
    "tokio",
] }

# Test runtime and staging
tempfile = { version = "3.27", default-features = false }
tokio = { version = "1.52", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
] }
