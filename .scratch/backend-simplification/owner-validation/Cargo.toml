[package]
name = "owner-local-validation"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
# Production modules under test
db = { package = "idp-db", path = "../../../crates/db", default-features = false, features = [
   "replica",
] }
embedded-db = { path = "../../../crates/embedded-db", default-features = false }
idp-service = { path = "../../../crates/idp-service", default-features = false, features = [
   "replica",
   "std",
] }
management-service = { path = "../../../crates/management-service", default-features = false, features = [
   "replica",
   "std",
] }
of-model = { path = "../../../crates/of-model", default-features = false, features = [
   "replica",
   "std",
] }
ofdb-kv = { path = "../../../../ofdb/crates/kv", default-features = false, features = [
   "redb",
   "sync",
] }
ofdb-sql = { path = "../../../../ofdb/crates/sql", default-features = false, features = [
   "redb",
   "sql",
] }

# Local TLS
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Runtime and serialization
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", default-features = false, features = [
   "derive",
   "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
tempfile = { version = "3.27", default-features = false }
tokio = { version = "1.52", default-features = false, features = [
   "macros",
   "rt-multi-thread",
   "net",
   "sync",
   "time",
] }
rust-argon2 = { version = "3.0", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
