[package]
name = "of-storage-client"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = ["native"]
native = [
    "ofdb-sql/sync",
    "ofdb-sql/redb",
    "ofdb-sql/sql",
    "ofdb-kv/sync",
    "ofdb-kv/redb",
]
browser = [
    "ofdb-sql/sync",
    "ofdb-sql/indexeddb",
    "ofdb-sql/sql",
    "ofdb-kv/sync",
    "ofdb-kv/indexeddb",
    # "file-system/browser",
]

[dependencies]
# Serialization
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_with = { version = "3.8", default-features = false, features = [
    "std",
    "macros",
] }
serde_repr = { version = "0.1", default-features = false }
url = { version = "2.5", default-features = false, features = ["std"] }
uuid = { version = "1.29", default-features = false, features = [
    "serde",
    "std",
] }

# Verified HTTP transport
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls-native-roots",
] }

# Internal
of-model = { path = "../of-model", default-features = false, features = [] }
storage-service = { version = "0.1", path = "../storage-service", default-features = false, optional = true }
of-management-client = { version = "0.1", path = "../management-client", default-features = false, optional = true }

# Data engines
ofdb-sql = { version = "0.1", path = "../../../ofdb-buildfix/crates/sql", package = "ofdb-sql", default-features = false }
ofdb-sync = { package = "ofdb-sync", path = "../../../ofdb-buildfix/crates/sync", default-features = false }
ofdb-kv = { version = "0.1", path = "../../../ofdb-buildfix/crates/kv", package = "ofdb-kv", default-features = false }
# file-system = { version = "0.1", path = "../../../offs-buildfix/crates/file-system", package = "file-system", default-features = false }

# Async
tokio = { version = "1.44", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = { version = "0.1", default-features = false }

# Error handling
thiserror = { version = "2.0", default-features = false }
anyhow = { version = "1.0", default-features = false, optional = true }

# Sync
# ofdb-sql-sync was renamed to ofdb-sync in ofdb
# ofdb-sql-sync = { version = "0.1", path = "../../../ofdb-buildfix/crates/sql-sync", package = "ofdb-sql-sync", default-features = false, features = ["native-stage"] }

# Platform
ofdb-platform = { version = "0.1", path = "../../../ofdb-buildfix/crates/platform", package = "ofdb-platform", default-features = false, optional = true }
