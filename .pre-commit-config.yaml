repos:
  - repo: of
    hooks:
      - id: fmt
        name: Run rustfmt
        entry: just fmt
        language: system
        files: \.rs$
        pass_filenames: false
      - id: clippy
        name: Run clippy (fail on warnings)
        entry: just clippy
        language: system
        files: \.rs$
        pass_filenames: false
