[package]
name = "api"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OAuth 2.x API"

[lib]
name = "api"

[features]
default = []
test-support = []

[dependencies]

# Web
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
utoipa = { version = "5.5", default-features = false, features = ["macros"] }
utoipa-axum = { version = "0.2", default-features = false }

# async
tokio = { version = "1.52", default-features = false, features = ["net", "signal", "rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = [] }

# serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }

# logging
log = { version = "0.4", default-features = false, features = [] }

# Local HTTPS setup
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower-http = { version = "0.7", default-features = false, features = ["cors"] }

# Setup admission
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
getrandom = { version = "0.3", default-features = false }
subtle = { version = "2.6", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
# Admission boundary tests
tempfile = { version = "3.27", default-features = false }
