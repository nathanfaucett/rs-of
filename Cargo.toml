[package]
name = "idp-unified"
description = "Local First OIDC / OAuth 2.x implementation"
repository = "https://github.com/aicacia/rs-oauth"
rust-version = "1.100"
edition = "2024"
keywords = ["oauth", "oidc", "identity", "offline-first", "unified"]
categories = [
    "authentication",
    "database",
    "filesystem",
    "network-programming",
    "wasm",
]

[package.version]
workspace = true

[package.authors]
workspace = true

[package.license]
workspace = true

[[bin]]
name = "idp-unified"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "completions"]
cli = ["unified-server/cli"]
completions = ["unified-server/completions"]

[dependencies]
# Internal
unified-server = { path = "./services/unified-server", default-features = false, optional = true }

# Async
tokio = { version = "1.52", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }

[workspace]
members = [
    "services/idp-client",
    "services/management-client",
    "services/device-client",
    "services/storage-client",
    "services/storage-api-client",
    "services/db",
    "services/cli",
    "services/server-common",
    "services/key",
    "services/management-server",
    "services/management-service",
    "services/device-service",
    "services/device-server",
    "services/model",
    "services/idp-server",
    "services/idp-service",
    "services/storage-server",
    "services/storage-service",
    "services/unified-server",
    "services/tauri-plugin-fetch-api",
    # "apps/app/src-tauri",  # Tauri app with independent setup - build separately
    "db/btree",
    "db/btree-automerge",
    "db/btree-indexeddb",
    "db/btree-redb",
    "db/kv",
    "db/kv-client",
    "db/kv-client-cli",
    "db/kv-proto",
    "db/kv-server",
    "db/kv-server-cli",
    "db/kv-store",
    "db/platform",
    "db/sql",
    "db/sql-client",
    "db/sql-client-cli",
    "db/sql-engine",
    "db/sql-engine-automerge",
    "db/sql-engine-indexeddb",
    "db/sql-engine-redb",
    "db/sql-history",
    "db/sql-macros",
    "db/sql-proto",
    "db/sql-protocol",
    "db/sql-query",
    "db/sql-schema",
    "db/sql-server",
    "db/sql-server-cli",
    "db/sql-test",
    "db/sql-translator",
    "db/sync",
    "db/value",
    "fs/file-system",
    "fs/file-system-wasm",
    "net/iroh-chain",
    "net/iroh-chain-wasm",
]
exclude = ["db/wasm"]


[workspace.dependencies]
setup = { path = "services/setup", default-features = false }
js-sys = { version = "0.3", default-features = false }
wasm-bindgen = { version = "0.2", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }
uuid = { version = "1.29", default-features = false, features = ["v7", "js"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["nathanfaucett@gmail.com"]
license = "MIT OR Apache-2.0"
rust-version = "1.100"
repository = "https://github.com/aicacia/rs-oauth"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
deprecated = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# These lints are from the `restriction` lint group and prevent specific
# constructs being used in code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
string_to_string = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
absolute_paths = "warn"
redundant_clone = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
# System-test service entry points
server-common = { path = "services/server-common", default-features = false, features = [
    "testing",
] }
device-server = { path = "services/device-server", default-features = false, features = [
    "cli",
] }
idp-server = { path = "services/idp-server", default-features = false, features = [
    "cli",
] }
idp-service = { path = "services/idp-service", default-features = false, features = [
    "ofdb",
    "std",
] }
management-server = { path = "services/management-server", default-features = false, features = [
    "cli",
] }
storage-server = { path = "services/storage-server", default-features = false, features = [
    "cli",
    "network",
] }

# Generated public clients
of-device-client = { path = "services/device-client", default-features = false }
of-idp-client = { path = "services/idp-client", default-features = false }
of-management-client = { path = "services/management-client", default-features = false }
of-storage-client = { path = "services/storage-client", default-features = false }
of-storage-api-client = { path = "services/storage-api-client", default-features = false }

# Isolated fixtures
keyring-core = { version = "1.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "rustls-tls-native-roots",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tempfile = { version = "3.27", default-features = false }

# Existing native resource protocol clients
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
async-trait = { version = "0.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
of-model = { path = "services/model", default-features = false, features = [
    "ofdb",
    "std",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }

# Public owner boundary fixtures
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "http2",
    "tokio",
] }
db = { package = "of-db", path = "services/db", default-features = false, features = [
    "ofdb",
] }
device-service = { path = "services/device-service", default-features = false, features = [
    "ofdb",
    "std",
    "utoipa",
] }
http = { version = "1.4", default-features = false }

iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
iroh-chain = { path = "net/iroh-chain", default-features = false }
log = { version = "0.4", default-features = false, features = ["std"] }
management-service = { path = "services/management-service", default-features = false, features = [
    "ofdb",
    "std",
] }

ofdb-sql = { path = "db/sql", default-features = false, features = [
    "native-stage",
] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
] }
storage-service = { path = "services/storage-service", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true

[[test]]
name = "owner_boundaries"
