[package]
name = "lidp"
version = "0.1.0"
description = "Local First Identity Provider Tauri App"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "lidp"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Generated HTTP operations
of-idp-client = { path = "../../../crates/idp-client", default-features = false }
of-device-client = { path = "../../../crates/device-client", default-features = false }

# HTTP
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "rustls-tls-native-roots",
] }

# Protected local state
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# TLS
rustls = { version = "0.23", default-features = false, features = [] }

# Async
log = "0.4"
tokio = { version = "1.52", default-features = false, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# Service contracts
api = { path = "../../../crates/api", default-features = false, features = [] }
idp-model = { path = "../../../crates/idp-model", default-features = false, features = [
  "replica",
  "std",
] }
management-server = { path = "../../../crates/management-server", default-features = false, features = [] }
unified-server = { path = "../../../crates/unified-server", default-features = false, features = [] }

# Desktop
tauri = { version = "2", default-features = false, features = [
  "tray-icon",
  "wry",
] }
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = { version = "2", default-features = false, features = [] }
tauri-plugin-single-instance = { version = "2", default-features = false, features = [
  "deep-link",
] }

[dev-dependencies]
# Owner qualification
idp-service = { path = "../../../crates/idp-service", default-features = false, features = ["std"] }
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }

# Keyring
keyring-core = { version = "1.0", default-features = false, features = [] }

# Utilities
uuid = { version = "1.16", default-features = false, features = ["std", "v4"] }
