[package]
name = "tauri-plugin-fetch-api"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "tauri-plugin-fetch-api"

[lib]
name = "tauri_plugin_fetch_api"

[dependencies]
axum = "0.8"
tauri = { version = "2.11.3" }
serde = "1.0"
serde_json = "1.0"
log = "0.4"
tokio-stream = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[package.metadata.platforms.support]
windows = { level = "full" }
linux = { level = "full" }
macos = { level = "full" }
android = { level = "full" }
ios = { level = "full" }

[lints]
workspace = true
