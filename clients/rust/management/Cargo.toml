[package]
name = "of-management-client"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
# Serialization
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_with = { version = "3.8", default-features = false, features = ["std", "macros"] }
serde_repr = { version = "0.1", default-features = false }
url = { version = "2.5", default-features = false, features = ["std"] }

# Verified HTTP transport
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"] }
