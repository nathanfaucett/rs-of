[package]
name = "idp-db"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OAuth 2.x database utilities"

[lib]
name = "db"

[features]
default = ["native", "replica"]
native = ["dep:ofdb-sql", "ofdb-sql/redb"]
replica = ["native", "ofdb-sql/in-memory", "ofdb-sql/macros"]
remote = ["replica", "ofdb-sql/remote", "dep:serde", "dep:tokio", "dep:url"]
network = ["native", "ofdb-sql/sync", "dep:iroh"]
server = ["native", "ofdb-sql/server"]

[dependencies]
# Configuration
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
], optional = true }
tokio = { version = "1.52", default-features = false, features = [
    "time",
], optional = true }
url = { version = "2.5", default-features = false, features = [
    "std",
], optional = true }

# Database
ofdb-sql = { package = "ofdb-sql", path = "../../../ofdb/crates/sql", default-features = false, features = [
    "sql",
], optional = true }

# Stream transport
iroh = { version = "1.1", default-features = false, features = ["tls-ring"], optional = true }
