[package]
name = "unified-server"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Composition host for unified service deployment"

[lib]
name = "unified_server"

[[bin]]
name = "unified-server"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:cli", "dep:env_logger", "tokio/signal"]
completions = ["cli", "dep:clap_complete"]
swagger-ui = [
    "idp-server/swagger-ui",
    "management-server/swagger-ui",
    "device-server/swagger-ui",
    "storage-server/swagger-ui",
]

[dependencies]
# CLI
clap = { version = "4.6", default-features = false, features = [
    "std",
    "derive",
    "help",
], optional = true }
clap_complete = { version = "4.5", default-features = false, features = [
], optional = true }
cli = { path = "../cli", default-features = false, features = [
    "std",
], optional = true }

# Configuration
config = { version = "0.15", default-features = false, features = ["yaml"] }

# Internal
api = { path = "../api", default-features = false }
setup = { workspace = true }
device-server = { path = "../device-server", default-features = false }
idp-server = { path = "../idp-server", default-features = false }
management-server = { path = "../management-server", default-features = false }
storage-server = { path = "../storage-server", default-features = false, features = [
    "network",
] }

# Serialization
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "rustls-tls-native-roots",
] }

# Async
tokio = { version = "1.52", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
] }
tokio-util = { version = "0.7", default-features = false, features = [] }

# Logging
env_logger = { version = "0.10", default-features = false, features = [
], optional = true }

# Web
tower = { version = "0.5", default-features = false, features = ["util"] }
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "http2",
    "tokio",
] }

[dev-dependencies]
# Contract export and isolated composition fixtures
device-service = { path = "../device-service", default-features = false, features = ["replica", "std", "utoipa"] }
idp-model = { path = "../idp-model", default-features = false, features = [
    "std",
    "replica",
] }
# OpenAPI contract export example
utoipa = { version = "5.5", default-features = false }

# Setup trust/verifier fault injection, never a production feature
api = { path = "../api", default-features = false, features = ["test-support"] }

# Identity fixtures
keyring-core = { version = "1.0", default-features = false, features = [] }

# Web
