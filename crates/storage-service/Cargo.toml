[package]
name = "storage-service"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Internal
file-system = { path = "../../../offs/crates/file-system", default-features = false, features = [
] }
of-model = { path = "../of-model", default-features = false, features = ["std"] }
ofdb-kv = { path = "../../../ofdb/crates/kv", default-features = false, features = [
    "redb",
    "sync",
] }
ofdb-sql = { package = "ofdb-sql", path = "../../../ofdb/crates/sql", default-features = false, features = [
    "redb",
    "sql",
] }

# Serialization
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# OpenAPI
utoipa = { version = "5.5", default-features = false, features = ["macros"] }

# Async
tokio = { version = "1.53", default-features = false, features = ["sync"] }

# Utilities
uuid = { version = "1.29", default-features = false, features = [
    "std",
    "v5",
    "v7",
] }

[dev-dependencies]
# Async
tokio = { version = "1.52", default-features = false, features = [
    "rt",
    "macros",
] }
