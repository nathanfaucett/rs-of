[package]
name = "file-system-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["filesystem", "wasm", "browser", "offline-first"]
categories = ["filesystem", "wasm"]
description = "Browser (WASM) TypeScript-facing API for file-system"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "file_system_wasm"

[features]
default = []

[dependencies]
# WASM
console_error_panic_hook = { version = "0.1", default-features = false }
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
