name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/password-manager/package-lock.json

      - name: Install dependencies
        working-directory: apps/password-manager
        run: npm ci

      - name: Type check
        working-directory: apps/password-manager
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/password-manager
        run: npm run build

      - name: Lint
        working-directory: apps/password-manager
        run: npm run lint

      - name: Test
        working-directory: apps/password-manager
        run: npm run test
